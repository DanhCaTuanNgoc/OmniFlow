[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

remappings = [
    "@reactive-network/reactive-lib/=lib/reactive-lib/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Chuẩn EVM Cancun hoặc Shanghai
evm_version = "shanghai"
