version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniflow-backend
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - NODE_ENV=production
      - BASE_SEPOLIA_RPC_URL=https://sepolia.base.org
      - LASNA_RPC_URL=https://lasna-rpc.rnk.dev
      - CORS_ORIGINS=http://localhost:3000,https://omniflow.app
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: omniflow-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/stream
    depends_on:
      - backend
    restart: unless-stopped
